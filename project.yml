# xcodegen project spec.
# Run `xcodegen generate` (locally or in CI) to produce HomeboxCatalog.xcodeproj.
name: HomeboxCatalog
# Bundle id stays "com.homeboxcatalog.app" so AltStore reinstalls update the existing
# app in place instead of treating the rename as a different app.
options:
  bundleIdPrefix: com.homeboxcatalog
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  HomeboxCatalog:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "**/*.md"
          - "project.yml"
          - ".github/**"
          - ".git/**"
          - "build/**"
          - "android/**"
          - "Frameworks/**"
          - "scripts/**"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HomeBoy
        CFBundleShortVersionString: "1.0.131"
        CFBundleVersion: "132"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow plaintext HTTP to self-hosted Homebox on LAN (e.g. http://192.168.x.x:3100).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "HomeBoy uses the camera to photograph items and to scan product barcodes and Homebox QR codes."
        NSPhotoLibraryUsageDescription: "Pick a photo from your library to attach to an item in Homebox."
        # Required by the "Save to Photos" action in the full-screen photo viewer.
        # Without it, saving hits a TCC violation instead of prompting.
        NSPhotoLibraryAddUsageDescription: "Save an item's photo from HomeBoy into your photo library."
        # Insurance for iOS 27's UIScene life-cycle enforcement, which keys off the
        # linked SDK. This app uses the pure SwiftUI App/WindowGroup life cycle and
        # should already be compliant, but xcodegen never emits this key while
        # Xcode's own SwiftUI template does — so declare it explicitly.
        # `false` is the documented default, making this a no-op on iOS 26.
        # Deliberately NO UISceneConfigurations / UISceneDelegateClassName: naming a
        # delegate class that doesn't exist in this repo would override the scene
        # configuration SwiftUI installs for WindowGroup and break launch outright.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homeboxcatalog.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: HomeboxCatalog-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Frameworks"
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
        codeSign: false
